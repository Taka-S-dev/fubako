name: Release

on:
  push:
    tags: ['v*']
  # タグなしで手動実行した場合はリリースを作らず、成果物だけ添付する
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tagName が空のときリリースは作成されず、ビルドのみ行われる
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Fubako ${{ github.ref_name }}
          releaseBody: Windows installer built from ${{ github.sha }}.
          releaseDraft: true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fubako-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
