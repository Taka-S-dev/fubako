name: Release

on:
  push:
    tags: ['v*']
  # タグなしで手動実行した場合はリリースを作らず、成果物だけ添付する
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 使うコンパイラは rust-toolchain.toml が決める。
      # ここでは何が選ばれたかをログに残すだけ
      - name: Toolchain
        run: rustup show active-toolchain && rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tagName が空のときリリースは作成されず、ビルドのみ行われる
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Fubako ${{ github.ref_name }}
          releaseBody: Windows installer built from ${{ github.sha }}.
          releaseDraft: true

      # インストール不要で起動できる単体exe。WebView2 ランタイムは同梱しないため、
      # 入っていない環境では起動しない（その場合はインストーラー版を使う）
      - name: Stage portable executable
        run: |
          $exe = Get-ChildItem src-tauri/target/release -Filter *.exe -File |
            Where-Object { $_.Name -notmatch '^(build|deps)' } | Select-Object -First 1
          if (-not $exe) { throw "portable executable not found" }
          Copy-Item $exe.FullName Fubako.exe

      - name: Attach portable executable to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} Fubako.exe --clobber

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fubako-windows
          path: |
            Fubako.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
