name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    # Windows 専用アプリのため、CI も実際の対象プラットフォームで回す
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 使うコンパイラは rust-toolchain.toml が決める。
      # ここでは何が選ばれたかをログに残すだけ
      - name: Toolchain
        run: rustup show active-toolchain && rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Frontend test
        run: npm test

      # tauri-build は frontendDist の存在を前提にするため cargo より先に実行する
      - name: Build frontend
        run: npm run build

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test
